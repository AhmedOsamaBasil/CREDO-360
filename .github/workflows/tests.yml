name: tests

on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install CPU test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas scipy scikit-learn matplotlib PyYAML pytest
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Replay and calibration tests
        run: python -m pytest testbed/tests -q
      - name: Portable-model tests
        run: python live_testbed/test_portable.py
      - name: Objective recovery, timing and regression tests
        run: python -m pytest recovery_pilot feasibility_recovery horizon_recovery objective_diagnostics recovery_objective allowance_scheduler causal_compensation feasibility_frontier reserve_recovery service_opportunity live_testbed/test_candidate_scaling.py live_testbed/test_gate_analysis.py live_testbed/test_journal_runner.py multimedia_testbed/test_generalization.py -q
      - name: Verify published pilot artifact integrity
        run: python -m recovery_pilot.audit_results
      - name: Replay and verify the fresh-content feasibility artifact
        run: python -m feasibility_recovery.audit
      - name: Replay and verify the longer-horizon artifact when published
        if: hashFiles('horizon_recovery/results/v3/metadata.json') != ''
        run: python -m horizon_recovery.audit
      - name: Replay and verify the exposed-data objective diagnosis when published
        if: hashFiles('objective_diagnostics/results/development_v1/metadata.json') != ''
        run: python -m objective_diagnostics.audit
      - name: Verify the exact analytical recovery objective when published
        if: hashFiles('recovery_objective/results/analytic_v1/metadata.json') != ''
        run: python -m recovery_objective.verify
      - name: Verify causal allowance scheduling and exact regret certificates
        if: hashFiles('allowance_scheduler/results/analytic_v1/metadata.json') != ''
        run: python -m allowance_scheduler.verify
      - name: Replay bounded-loss development on exposed data
        if: hashFiles('causal_compensation/results/development_v1/metadata.json') != ''
        run: python -m causal_compensation.verify
      - name: Verify the separately labeled opportunity diagnosis
        if: hashFiles('causal_compensation/results/development_v1/posthoc_metadata.json') != ''
        run: python -m causal_compensation.diagnose
      - name: Verify exposed-data feasibility frontier and independent dynamic programming
        if: hashFiles('feasibility_frontier/results/audit_v1/metadata.json') != ''
        run: |
          python -m feasibility_frontier.verify
          python -m feasibility_frontier.check_breakpoints
      - name: Verify limited recovery reserve and analytical causal comparisons
        if: hashFiles('reserve_recovery/results/analysis_v1/metadata.json') != ''
        run: |
          python -m reserve_recovery.verify
          python -m reserve_recovery.check_catalogue
      - name: Verify controlled service evidence and exposed causal opportunity model
        if: hashFiles('service_opportunity/results/development_v1/metadata.json') != ''
        run: python -m service_opportunity.verify

